namespace: ecommerce

backend:
  image:
    repository: ecommerce-backend
    tag: "1.3"
    pullPolicy: Never

  replicas: 2

  service:
    port: 80
    targetPort: 5000

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60

frontend:
  image:
    repository: ecommerce-frontend
    tag: "1.1"
    pullPolicy: Never

  replicas: 2

  service:
    port: 80
    targetPort: 8080

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

mysql:
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent

  replicas: 1

  service:
    port: 3306
    targetPort: 3306

  database: ecommerce

  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  persistence:
    enabled: true
    existingClaim: mysql-pvc
    size: 1Gi
    accessMode: ReadWriteOnce
    storageClass: standard

ingress:
  enabled: true
  className: nginx

backup:
  enabled: true
  existingClaim: mysql-backup-pvc
  schedule: "*/5 * * * *"
  storageSize: 1Gi
  storageClass: standard

rbac:
  enabled: true

serviceMonitor:
  enabled: true
  interval: 15s
  path: /metrics

config:
  appEnv: production
  logLevel: info
  backendURL: http://backend
